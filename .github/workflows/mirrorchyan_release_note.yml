name: mirrorchyan_release_note

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag (defaults to the latest release)
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MirrorChyanUploadToken:
        required: true
  release:
    types: [edited]

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'bingyunhe' && (github.event_name != 'release' || !github.event.release.draft) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(gh release view --repo bingyunhe/hongxue-stronghold-companion --json tagName --jq .tagName)
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: MirrorChyan/release-note-action@v1
        with:
          mirrorchyan_rid: hongxue-stronghold-companion
          version_name: ${{ steps.release.outputs.tag }}
          owner: bingyunhe
          repo: hongxue-stronghold-companion
          github_token: ${{ github.token }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
