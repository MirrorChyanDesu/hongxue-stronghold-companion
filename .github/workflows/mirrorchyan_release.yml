name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag (defaults to the latest release)
        required: false
        type: string

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'bingyunhe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG=$(gh release view --repo bingyunhe/hongxue-stronghold-companion --json tagName --jq .tagName)
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: hongxue-stronghold-companion-v*-win-x64.zip
          mirrorchyan_rid: hongxue-stronghold-companion
          tag: ${{ steps.release.outputs.tag }}
          os: win
          arch: x64
          owner: bingyunhe
          repo: hongxue-stronghold-companion
          github_token: ${{ github.token }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}

  sync-release-note:
    needs: mirrorchyan
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mirrorchyan_release_note.yml
    with:
      tag: ${{ needs.mirrorchyan.outputs.tag }}
    secrets:
      MirrorChyanUploadToken: ${{ secrets.MirrorChyanUploadToken }}
